<!DOCTYPE html>
<html>
<head>
  <title>Store Setup</title>
  <style>
    * { font-family: Arial; }
    body { background: #1f2937; color: white; padding: 40px; }
    .box { max-width: 500px; margin: auto; background: #374151; padding: 30px; border-radius: 10px; }
    input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: none; border-radius: 5px; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background: #2563eb; }
    code { background: #1f2937; padding: 10px; display: block; margin-top: 10px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Store Setup</h2>
    <input type="text" id="storeName" placeholder="Store Name" required>
    <input type="tel" id="phone" placeholder="Phone" required>
    <input type="email" id="email" placeholder="Email" required>
    <select id="color" required>
      <option value="">Select Color</option>
      <option value="#3b82f6">Blue</option>
      <option value="#ef4444">Red</option>
      <option value="#10b981">Green</option>
      <option value="#ec4899">Pink</option>
    </select>
    <textarea id="welcomeMsg" placeholder="Welcome Message" required></textarea>
    <button onclick="deploy()">Deploy Now</button>
    <div id="result"></div>
  </div>

  <script>
    async function deploy() {
      const storeName = document.getElementById('storeName').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const color = document.getElementById('color').value;
      const welcomeMsg = document.getElementById('welcomeMsg').value;

      if (!storeName || !phone || !email || !color || !welcomeMsg) {
        alert('Fill all fields');
        return;
      }

      const response = await fetch('https://api-deploy-js.vercel.app/api/deploy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeName, phone, email, color, welcomeMsg })
      });

      const result = await response.json();
      if (result.success) {
        document.getElementById('result').innerHTML = '<p style="color: #10b981; margin-top: 20px;"><strong>✅ Success!</strong></p><code>' + result.embedCode + '</code>';
        navigator.clipboard.writeText(result.embedCode);
      }
    }
  </script>
</body>
</html>
